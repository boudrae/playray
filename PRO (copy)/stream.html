<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamGo - Live Stream</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* --- 1. VARIABLES & THEMES --- */
:root {
--bg-color: #0b0f1a;
--card-bg: #1e2533;
--card-border: rgba(255, 255, 255, 0.08);
--text-primary: #ffffff;
--text-secondary: #94a3b8;
--header-bg: rgba(11, 15, 26, 0.9);
--accent-gradient: linear-gradient(90deg, #ff5f00, #ffc400, #20e2af, #00d2ff, #7a5fff, #ff2d55);
--card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
--pill-bg: #232a3b;
--header-border: rgba(255, 255, 255, 0.08);
--live-red: #ff3b3b;
--live-glow: rgba(255, 59, 59, 0.4);
--toggle-bg: #232a3b;
--player-bg: #000000;
--match-bar-bg: #161b26;
}

[data-theme="light"] {
    --bg-color: #f1f5f9;
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.08);
    --header-bg: #dc2626; 
    --header-border: rgba(255, 255, 255, 0.2);
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    --toggle-bg: rgba(0,0,0,0.1);
    --match-bar-bg: #ffffff;
}

/* --- 2. BASE STYLES --- */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 50px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

/* --- 3. HEADER --- */
header {
    background-color: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--header-border);
}
.logo { position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
.theme-switch-wrapper {
    display: flex;
    align-items: center;
}


.theme-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--header-border);
    background: var(--pill-bg);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.3s ease;
}

[data-theme="light"] .theme-btn {
    background: rgba(255,255,255,0.2);
}

.theme-btn:hover {
    transform: scale(1.05);
}

/* --- 4. MATCH BAR --- */
.match-info-bar {
    background: var(--match-bar-bg); padding: 20px; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; border-bottom: 1px solid var(--header-border); box-shadow: var(--card-shadow);
}
.bar-team { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 16px; }
.bar-team.left { justify-content: flex-end; text-align: right; }
.bar-team img { width: 40px; height: 40px; object-fit: contain; }
.status-badge {
    background: #232a3b; color: var(--text-secondary); padding: 6px 16px; border-radius: 10px;
    font-size: 11px; font-weight: 800; text-transform: uppercase; margin: 0 30px; border: 1px solid var(--header-border);
}
.status-badge.live { background: var(--live-red); color: white; box-shadow: 0 0 15px var(--live-glow); animation: pulse 2s infinite; }
.gradient-divider { height: 2px; width: 100%; background: var(--accent-gradient); }

/* --- 5. PLAYER SECTION --- */
.player-section { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
.player-container {
    width: 100%; aspect-ratio: 16 / 9; background: var(--player-bg); border-radius: 24px;
    position: relative; overflow: hidden; box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
    border: 1px solid var(--card-border); cursor: pointer;
}
.ui-layer {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    align-items: center; z-index: 5; background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%);
    text-align: center; transition: opacity 0.5s ease;
}
.play-icon-wrapper {
    width: 90px; height: 90px; background: var(--live-red); border-radius: 50%;
    display: flex; justify-content: center; align-items: center; transition: transform 0.3s;
    box-shadow: 0 0 40px var(--live-glow);
}
.player-container:hover .play-icon-wrapper { transform: scale(1.1); }
.play-icon-wrapper svg { fill: white; width: 32px; height: 32px; margin-left: 6px; }
.status-text { margin-top: 24px; font-size: 18px; font-weight: 600; color: white; }

/* --- FAKE PLAYER INTERACTION STYLES --- */
.interaction-layer { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); }
.prog-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); }
.prog-bar { height: 100%; width: 0%; background: var(--live-red); box-shadow: 0 0 10px var(--live-red); transition: width 0.2s linear; }
.verify-screen { 
    position: absolute; inset: 0; z-index: 20; background: var(--bg-color); 
    display: none; flex-direction: column; justify-content: center; align-items: center; 
    padding: 40px; text-align: center; animation: fadeIn 0.5s ease forwards;
}
.verify-card { max-width: 400px; animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
.verify-card h2 { font-size: 28px; font-weight: 800; margin-bottom: 15px; line-height: 1.2; }
.verify-card p { color: var(--text-secondary); margin-bottom: 25px; font-size: 15px; }
.countdown-timer { font-size: 14px; font-weight: 700; color: var(--live-red); margin-bottom: 25px; padding: 8px 16px; background: rgba(255,59,59,0.1); border-radius: 50px; display: inline-block; }
.cta-btn { 
    background: var(--live-red); color: white; padding: 18px 36px; border-radius: 12px; 
    font-weight: 800; font-size: 18px; text-decoration: none; display: block; 
    box-shadow: 0 10px 25px var(--live-glow); transition: 0.3s; border: none; cursor: pointer; width: 100%;
}
.cta-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--live-glow); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 768px) {
    .match-info-bar { grid-template-columns: 1fr; gap: 15px; }
    .status-badge { order: -1; margin: 0 auto; width: fit-content; }
    .bar-team.left, .bar-team.right { justify-content: center; text-align: center; }
    .verify-card h2 { font-size: 22px; }
}
</style>
</head>
<body>

<header>
    <div class="theme-switch-wrapper">
    <button class="theme-btn" id="theme-btn">
        <i class="fa-solid fa-moon"></i>
    </button>
</div>
    <div class="logo">StreamGo</div>
</header>
<div class="gradient-divider"></div>

<div class="match-info-bar" id="match-bar"></div>

<section class="player-section">
    <div class="player-container" id="video-trigger" onclick="startStream()">
        <!-- Initial UI -->
        <div class="ui-layer" id="player-ui">
            <div class="play-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
            <div class="status-text" id="status-label">Tap to start live stream</div>
        </div>

        <!-- Progress Interaction -->
        <div class="interaction-layer" id="int-layer">
            <div class="status-text" id="int-msg" style="margin-top:0">Connecting...</div>
            <div class="prog-container"><div class="prog-bar" id="prog-fill"></div></div>
        </div>

        <!-- Verification Screen -->
        <div class="verify-screen" id="verify-screen">
            <div class="verify-card">
                <h2>⚠️ Verification failed</h2>
                <p>Complete a quick verification to continue watching.</p>
                <button class="cta-btn" onclick="window.location.href='https://streamgo.website/sl/ppnex'">Verify & Watch</button>
            </div>
        </div>
    </div>
</section>

<script>
    // THEME
    const themeBtn = document.getElementById('theme-btn');
const themeIcon = themeBtn.querySelector('i');

function setTheme(m) {
    document.documentElement.setAttribute('data-theme', m);

    themeIcon.className = m === 'light'
        ? 'fa-solid fa-sun'
        : 'fa-solid fa-moon';

    localStorage.setItem('streamgo-theme', m);
}

setTheme(localStorage.getItem('streamgo-theme') || 'dark');

themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
});

    // MATCH DATA SYNC
    function getStatus(iso) {
        const diff = Math.floor((new Date(iso) - new Date()) / 60000);
        if (diff > 10) return { text: `UPCOMING`, class: "", live: false };
        if (diff <= 10 && diff > 0) return { text: "PRE-GAME", class: "live", live: true };
        if (diff <= 0 && diff > -150) return { text: "• LIVE NOW", class: "live", live: true };
        return { text: "GAME ENDED", class: "ended", live: false };
    }

    function init() {
        const p = new URLSearchParams(window.location.search);
        const match = { t1: p.get('t1') || "Team A", t2: p.get('t2') || "Team B", l1: p.get('l1') || "https://loodibee.com/wp-content/uploads/nba-logo.png", l2: p.get('l2') || "https://loodibee.com/wp-content/uploads/nba-logo.png" };
        const s = getStatus(p.get('time'));
        
        // Update Bar
        document.getElementById('match-bar').innerHTML = `<div class="bar-team left"><span>${match.t1}</span><img src="${match.l1}"></div><div class="status-badge ${s.class}">${s.text}</div><div class="bar-team right"><img src="${match.l2}"><span>${match.t2}</span></div>`;
        document.title = `${match.t1} vs ${match.t2} - StreamGo`;

        // UPDATE PLAYER UI TEXT DYNAMICALLY
        const statusLabel = document.getElementById('status-label');
        if (s.live) {
            statusLabel.innerText = "Watch Live Now";
        } else if (s.text === "GAME ENDED") {
            statusLabel.innerText = "Watch Replay";
        } else {
            statusLabel.innerText = "Tap to start live stream";
        }
    }
    init();

    // ENHANCED PLAYER LOGIC
    let active = false;
    function startStream() {
        if (active) return;
        active = true;

        const ui = document.getElementById('player-ui');
        const intLayer = document.getElementById('int-layer');
        const intMsg = document.getElementById('int-msg');
        const progFill = document.getElementById('prog-fill');
        const verifyScreen = document.getElementById('verify-screen');

        ui.style.opacity = '0';
        setTimeout(() => { ui.style.display = 'none'; intLayer.style.display = 'flex'; }, 500);

        const steps = [
            { t: 0, m: "Connecting to secure live stream..." },
            { t: 25, m: "Stream ready - optimizing quality..." },
            { t: 55, m: "Verifying your access..." },
            { t: 85, m: "Verification failed - action required" }
        ];

        let p = 0;
        const interval = setInterval(() => {
            p += 0.5;
            progFill.style.width = p + '%';
            
            const current = steps.filter(s => p >= s.t).pop();
            if (current && intMsg.innerText !== current.m) intMsg.innerText = current.m;

            if (p >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    intLayer.style.opacity = '0';
                    setTimeout(() => {
                        intLayer.style.display = 'none';
                        verifyScreen.style.display = 'flex';
                    }, 500);
                }, 800);
            }
        }, 35);
    }
</script>
</body>
</html>
